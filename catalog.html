<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Каталог · PunanovStore</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
    <script defer src="js/main.js"></script>
    <script defer src="js/data.js"></script>
    <script defer src="js/cart.js"></script>
    <script defer src="js/catalog.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">К содержимому</a>
    <header>
      <div class="site-header">
        <a href="index.html" aria-label="PunanovStore — главная"><img class="site-logo" src="images/logo.png" alt="PunanovStore" width="1310" height="224"></a>
        <button class="menu-toggle secondary" type="button" aria-controls="navigation" aria-expanded="false" hidden>Меню</button>
        <nav id="navigation" class="site-nav" aria-label="Основная навигация">
          <ul class="site-nav__list">
            <li><a href="index.html">Главная</a></li>
            <li><a href="catalog.html" aria-current="page">Каталог</a></li>
            <li><a href="order.html">Заявка</a></li>
            <li><a href="contacts.html">Контакты</a></li>
            <li><a href="cart.html">Корзина <span data-cart-count>0</span></a></li>
          </ul>
        </nav>
      </div>
    </header>
    <main id="main" tabindex="-1">
      <nav class="breadcrumbs" aria-label="Хлебные крошки"><a href="index.html">Главная</a> / Каталог</nav>
      <h1>Каталог товаров</h1>
      <div class="catalog-layout">
        <aside class="catalog-filters"><form id="filters" class="filters-form">
          <div class="form-field"><label for="search">Название товара</label><input id="search" type="search" placeholder="Найти товар"></div>
          <div class="form-field"><label for="category">Категория</label><select id="category"><option value="">Все категории</option></select></div>
          <div class="form-field"><label for="sort">Сортировка</label><select id="sort">
            <option value="">Исходный порядок</option><option value="asc">Сначала дешевле</option>
            <option value="desc">Сначала дороже</option><option value="title">По названию</option>
          </select></div>
          <button type="reset" class="secondary">Сбросить фильтры</button>
        </form></aside>
        <section class="catalog-products" aria-labelledby="results-title"><h2 id="results-title">Товары</h2>
          <p id="found" role="status"></p>
          <div class="products-grid" id="results"></div>
          <div id="empty-results" hidden><h3>Товары не найдены</h3><p>Попробуйте другую категорию или более короткое название.</p>
            <button class="secondary" type="button" id="show-all">Показать все товары</button></div>
          <p id="cart-notice" role="status"></p>
        </section>
      </div>
    </main>
    <footer><div>© 2026 PunanovStore · Учебный магазин</div></footer>

  </body>
</html>
